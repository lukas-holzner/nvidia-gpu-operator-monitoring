name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/build-docker.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/build-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cuda-vector-add

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CUDA version from Dockerfile
        id: cuda-version
        run: |
          CUDA_VERSION=$(grep -oP 'FROM nvidia/cuda:\K[0-9]+\.[0-9]+\.[0-9]+' docker/Dockerfile | head -1)
          echo "version=${CUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "CUDA version: ${CUDA_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cuda-${{ steps.cuda-version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
